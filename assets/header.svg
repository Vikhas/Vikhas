<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Vikhas Somasundaram Giri — Backend and AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b"/>
    </pattern>
    <style>
      .mono { font-family: 'Fira Code','JetBrains Mono',Menlo,Consolas,monospace; }
      .sans { font-family: 'Segoe UI',Inter,Helvetica,Arial,sans-serif; }
      .edge { stroke: #1f3a5f; stroke-width: 2; }
      .flow { stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 6 14; animation: dash 1.6s linear infinite; opacity: .7; }
      .flow2 { stroke: #a78bfa; stroke-width: 2; stroke-dasharray: 6 14; animation: dash 2.2s linear infinite reverse; opacity: .7; }
      .lbl { fill: #cbd5e1; font-size: 13px; }
      @keyframes dash { to { stroke-dashoffset: -40; } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .f1 { animation: fadeUp .8s ease-out both; }
      .f2 { animation: fadeUp .8s ease-out .3s both; }
      .f3 { animation: fadeUp .8s ease-out .6s both; }
      .f4 { animation: fadeUp .8s ease-out .9s both; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>
  <circle cx="950" cy="160" r="230" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- left: identity -->
  <text x="60" y="72" class="mono f1" font-size="17" fill="#64748b">// hello, world — I route packets and govern agents</text>
  <text x="58" y="138" class="sans f2" font-size="48" font-weight="800" fill="url(#name)">Vikhas Somasundaram Giri</text>
  <text x="60" y="182" class="sans f3" font-size="24" font-weight="600" fill="#e2e8f0">Backend &amp; AI Engineer</text>

  <g class="f4">
    <rect x="60" y="208" width="520" height="40" rx="8" fill="#0b1324" stroke="#1e293b"/>
    <circle cx="80" cy="228" r="5" fill="#f87171"/>
    <circle cx="97" cy="228" r="5" fill="#fbbf24"/>
    <circle cx="114" cy="228" r="5" fill="#34d399"/>
    <text x="134" y="234" class="mono" font-size="16" fill="#a3e635">$ ship --from=idea --to=production</text>
    <rect x="482" y="219" width="10" height="19" fill="#a3e635">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="60" y="284" class="sans f4" font-size="15" fill="#94a3b8">ex-Juniper SE III  ·  Forward Networks  ·  MS CS @ UC Davis</text>

  <!-- right: network graph -->
  <g>
    <line class="edge" x1="760" y1="95" x2="905" y2="62"/>
    <line class="edge" x1="905" y1="62" x2="1065" y2="105"/>
    <line class="edge" x1="760" y1="95" x2="815" y2="215"/>
    <line class="edge" x1="905" y1="62" x2="975" y2="190"/>
    <line class="edge" x1="1065" y1="105" x2="975" y2="190"/>
    <line class="edge" x1="815" y1="215" x2="975" y2="190"/>
    <line class="edge" x1="975" y1="190" x2="1120" y2="250"/>
    <line class="edge" x1="1065" y1="105" x2="1120" y2="250"/>

    <line class="flow" x1="760" y1="95" x2="905" y2="62"/>
    <line class="flow" x1="905" y1="62" x2="1065" y2="105"/>
    <line class="flow2" x1="815" y1="215" x2="975" y2="190"/>
    <line class="flow" x1="975" y1="190" x2="1120" y2="250"/>
    <line class="flow2" x1="905" y1="62" x2="975" y2="190"/>
  </g>

  <!-- packets -->
  <circle r="5" fill="#38bdf8">
    <animateMotion dur="4s" repeatCount="indefinite" path="M760,95 L905,62 L1065,105 L1120,250"/>
  </circle>
  <circle r="5" fill="#f472b6">
    <animateMotion dur="3.4s" begin="1s" repeatCount="indefinite" path="M815,215 L975,190 L1120,250"/>
  </circle>
  <circle r="4" fill="#a78bfa">
    <animateMotion dur="3s" begin="0.5s" repeatCount="indefinite" path="M760,95 L815,215 L975,190 L1065,105"/>
  </circle>

  <!-- nodes -->
  <g class="sans">
    <g>
      <circle cx="760" cy="95" r="10" fill="none" stroke="#38bdf8" stroke-opacity=".5">
        <animate attributeName="r" values="10;22" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".6;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="760" cy="95" r="9" fill="#0b1324" stroke="#38bdf8" stroke-width="3"/>
      <text x="734" y="80" class="lbl" text-anchor="end">Kafka</text>
    </g>
    <circle cx="905" cy="62" r="9" fill="#0b1324" stroke="#a78bfa" stroke-width="3"/>
    <text x="905" y="40" class="lbl" text-anchor="middle">MCP</text>
    <g>
      <circle cx="1065" cy="105" r="10" fill="none" stroke="#f472b6" stroke-opacity=".5">
        <animate attributeName="r" values="10;22" dur="2s" begin="0.7s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".6;0" dur="2s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1065" cy="105" r="9" fill="#0b1324" stroke="#f472b6" stroke-width="3"/>
      <text x="1085" y="100" class="lbl">LLM agents</text>
    </g>
    <circle cx="815" cy="215" r="9" fill="#0b1324" stroke="#34d399" stroke-width="3"/>
    <text x="800" y="244" class="lbl" text-anchor="middle">Kubernetes</text>
    <circle cx="975" cy="190" r="9" fill="#0b1324" stroke="#fbbf24" stroke-width="3"/>
    <text x="975" y="220" class="lbl" text-anchor="middle">Policy gate</text>
    <g>
      <circle cx="1120" cy="250" r="10" fill="none" stroke="#a3e635" stroke-opacity=".5">
        <animate attributeName="r" values="10;22" dur="2s" begin="1.3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".6;0" dur="2s" begin="1.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1120" cy="250" r="9" fill="#0b1324" stroke="#a3e635" stroke-width="3"/>
      <text x="1120" y="282" class="lbl" text-anchor="middle">prod</text>
    </g>
  </g>
</svg>
